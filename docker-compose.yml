services:
  api:
    build: .
    env_file: .env
    # Add timeout to prevent worker kills during long scans
    command: /bin/sh -lc "gunicorn --access-logfile - --error-logfile - -w ${GUNICORN_WORKERS:-2} -b 0.0.0.0:${PORT:-5001} --timeout 120 --graceful-timeout 30 main:app"
    volumes:
      - ./TradingPlans:/app/TradingPlans
      - ./output:/app/output
    ports:
      - "${PORT:-5001}:${PORT:-5001}"
    restart: unless-stopped
    # Add memory limits to prevent OOM kills
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  frontend:
    build: .
    env_file: .env
    command: /bin/sh -lc "gunicorn --access-logfile - --error-logfile - -w ${GUNICORN_WORKERS:-2} -b 0.0.0.0:${FRONTEND_PORT:-5000} --timeout 60 simple_frontend:frontend_app"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://api:5001}
    depends_on:
      - api
    ports:
      - "80:${FRONTEND_PORT:-5000}"
    restart: unless-stopped

